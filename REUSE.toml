# SPDX-FileCopyrightText: 2022 aas-core3.0rc02-csharp AUTHORS
#
# SPDX-License-Identifier: MIT

version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on GitHub and NuGet, the documentation), or which can
# not carry a comment (JSON, images).
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    "doc/README.md",
    "doc/source/**/*.md",
    "doc/source/docfx.json",
    "doc/source/api/.manifest",
    "doc/source/images/**",
    "src/.config/dotnet-tools.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# IDE settings and the solution file are written by Rider, ReSharper, PyCharm
# and Visual Studio, which would drop or misplace a header.
[[annotations]]
path = [
    ".idea/**",
    "src/.idea/**",
    "src/aas-core3.0rc02-csharp.sln",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# A plain word list, one entry per line, so a header would be read as words.
[[annotations]]
path = "src/AdditionalVerbsInImperativeMood.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# testgen/setup.py reads every non-empty line of the requirements file as
# a requirement, so a comment header would break the installation.
[[annotations]]
path = "testgen/requirements.txt"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# Test data and the recorded test outputs are generated by
# aas-core3.0rc02-testgen and compared byte-by-byte, and JSON can not carry
# a comment.
[[annotations]]
path = "test_data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# The meta-model and the code generated from it transcribe the AAS
# specification: the docstrings and the doc comments derived from them quote
# the definitions of the classes, attributes and constraints. That text keeps
# the license of the specification, next to the MIT license of our own code.
# The Release Candidate 2 of the specification by Plattform Industrie 4.0 is licensed under CC BY 4.0.
[[annotations]]
path = [
    "src/AasCore.Aas3_0_RC02/types.cs",
    "src/AasCore.Aas3_0_RC02/verification.cs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Plattform Industrie 4.0"
SPDX-License-Identifier = "CC-BY-4.0"
